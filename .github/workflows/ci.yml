name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-placeholder-secret
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/pit_lane_hub?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/pit_lane_hub?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-placeholder-secret
      AUTH_TRUST_HOST: "true"
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/pit_lane_hub?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/pit_lane_hub?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e
